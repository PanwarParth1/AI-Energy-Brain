# Render Blueprint for AI Energy Brain.
# Assumes backend/, frontend/, models/, data/ are at the ROOT of the GitHub repo.
# (If they are inside a "proj/" folder, see the deployment guide: set Root Directory to proj.)
services:
  # ---------- Backend API (FastAPI) ----------
  - type: web
    name: ai-energy-brain-api
    runtime: python
    plan: standard            # 2 GB RAM. The API needs ~1.2 GB; the 512 MB plans will crash.
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ALLOWED_ORIGINS   # set to the frontend URL after the frontend exists
        sync: false

  # ---------- Frontend (React + Vite static site) ----------
  - type: web
    name: ai-energy-brain-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL  # set to the backend URL (no trailing slash) BEFORE building
        sync: false
    routes:
      - type: rewrite          # lets /machine-simulator etc. work on refresh
        source: /*
        destination: /index.html
